<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tablet Hour</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>
  <div class="layout">

    <!-- 📅 Días -->
    <div class="days" id="days">
      <span>Lun</span>
      <span>Mar</span>
      <span>Mié</span>
      <span>Jue</span>
      <span>Vie</span>
      <span>Sáb</span>
      <span>Dom</span>
    </div>

    <div class="center-block">

      <!-- 🕒 Reloj -->
      <div class="clock" id="clock">--:--</div>

      <!-- ⭐ ICONOS + CLIMA EN LA MISMA FILA -->
      <div class="icons-weather-row">

        <div class="top-icons">
            <button id="open-timer" class="icon-btn">⏱️</button>
            <button id="open-calendar" class="icon-btn">📅</button>
        </div>

        <div class="weather-block">
          <img id="weather-icon" class="weather-icon" src="" alt="icono clima" />
          <div class="weather-temp" id="weather-temp">
            <span id="temp">--°C</span>
            <span id="condition">--</span>
            <span id="minmax">Min: --° / Max: --°</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- ⏱️ MODAL TEMPORIZADOR -->
  <div id="timer-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">✖</span>
      <h2>Temporizador</h2>

      <div id="timer-display">40:00</div>

      <div class="timer-buttons">
        <button id="add5">+5 min</button>
        <button id="sub5">-5 min</button>
        <button id="reset">Restablecer</button>
        <button id="start-stop">Iniciar</button>
      </div>
    </div>
  </div>

  <!-- 📅 MODAL CALENDARIO -->
  <div id="calendar-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal">✖</span>
      <h2 id="calendar-title"></h2>
      <div id="calendar-grid"></div>
    </div>
  </div>

  <!-- 📜 Scripts -->
  <script src="script.js"></script>
  <script src="modal.js"></script>
  <script src="timer.js"></script>
  <script src="calendar.js"></script>

  <div style="height: 1px;"></div>
</body>
</html>
