<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Permite fullscreen al agregar a pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111">

  <title>Tablet Hour</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>

<body>

  <div class="layout">

    <!-- 📅 Días -->
    <div class="days" id="days">
      <span>Lun</span>
      <span>Mar</span>
      <span>Mié</span>
      <span>Jue</span>
      <span>Vie</span>
      <span>Sáb</span>
      <span>Dom</span>
    </div>

    <div class="center-block">

      <!-- 🕒 Reloj -->
      <div class="clock" id="clock">--:--</div>

      <!-- 🌤️ Clima -->
      <div class="weather-block">
        <img id="weather-icon" class="weather-icon" src="" alt="icono clima" />
        <div class="weather-temp" id="weather-temp">
          <span id="temp">--°C</span>
          <span id="condition">--</span>
          <span id="minmax">Min: --° / Max: --°</span>
        </div>
      </div>

      <!-- 🔜 Mini resumen deportivo (lo agregamos después) -->
      <div id="evento-resumen"></div>

    </div>

  </div>

  <!-- 📜 Scripts -->
  <script src="script.js?v=2" defer></script>


  <!-- Ocultar barra superior de Chrome en Android 4.4.4 -->
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.scrollTo(0, 1);
      }, 300); // Chrome viejo necesita más delay
    });
  </script>

  <!-- Altura extra para forzar fullscreen -->
  <div style="height: 200px;"></div>

</body>
</html>
